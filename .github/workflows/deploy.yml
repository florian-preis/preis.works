# Builds the site and publishes it to GitHub Pages.
#
# This replaces GitHub's own automatic Jekyll build. We need our own because the
# photo thumbnails are generated during the build, which GitHub's version cannot do.
#
# If this workflow fails, nothing is published and the previous version of the
# site stays live. A failed build never takes the site down.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Build the site with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Generate photo thumbnails
        run: python3 tools/build-thumbnails.py _site

      - name: Drop the originals from the published site
        # The thumbnail script reads from the repository, not from _site, so the
        # derivatives already exist by this point. The full-size JPEGs are the bulk
        # of the artifact and nothing on the site ever requests them: the grid
        # loads thumbnails, the lightbox loads the 2000px WebP. Keeping them only
        # makes every deploy larger and slower.
        run: |
          rm -f _site/photography/*.jpg _site/photography/*.jpeg _site/photography/*.JPG _site/photography/*.JPEG
          echo "published site: $(du -sh _site | cut -f1)"
          du -sh _site/photography/thumb _site/photography/view

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 10 minutes. Raised because a large artifact can be slow
          # rather than genuinely stuck, and each retry costs a whole build.
          timeout: 1200000
