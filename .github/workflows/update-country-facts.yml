# Refreshes the country facts in gowiththeflo (population, GDP, Human Development
# Index) once a month and opens a pull request with a report of what changed.
#
# Nothing reaches the live site until you merge the pull request; merging to main
# then runs the normal build and deploy. A quiet month opens no pull request.
#
# One-time setting: Settings > Actions > General > Workflow permissions >
# tick "Allow GitHub Actions to create and approve pull requests".

name: Update country facts

on:
  schedule:
    - cron: '17 5 3 * *'    # 05:17 UTC on the 3rd of every month
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the updater
        run: node --test scripts/travel/update-country-facts.test.mjs

      - name: Fetch the latest figures
        # If the UNDP downloads page moves, set the file's address here:
        # env:
        #   HDR_CSV_URL: https://hdr.undp.org/sites/default/files/.../HDR..._Composite_indices_complete_time_series.csv
        run: node scripts/travel/update-country-facts.mjs --report "$RUNNER_TEMP/facts-report.md"

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: country-facts-update
          delete-branch: true
          add-paths: content/travel/facts/country-facts.json
          commit-message: Update country facts
          title: Country facts update
          body-path: ${{ runner.temp }}/facts-report.md
