# Hand-kept figures for places the World Bank and UNDP don't cover, and corrections.
# A value here wins over country-facts.json. Each value needs its year and source,
# and the drawer shows them. The monthly update lists entries older than two years.
#
# Fields: population, gdp, gdpPerCapita (with currency), hdi, hdiRank (with "of").
#
# Updated 8 November 2026. Review once a year, or when the monthly report flags them.
#
# Taiwan
# - Population: Ministry of the Interior, household registration, end of December 2025
# - GDP per person: DGBAS (Taiwan's statistics office), 2025 estimate of 30 January 2026
# - GDP: DGBAS GDP per person x mid-year 2025 population (about 23.35 million), rounded.
#   DGBAS publishes the total in NT$ (NT$28,715 billion, revised 29 May 2026)
# - Human development: DGBAS's own calculation with the UNDP method, for 2023 (the same
#   year as UNDP's current ranking). No rank, because UNDP doesn't rank Taiwan
#
# Vatican City
# - Population: residents (citizens and non-citizens) on 31 December 2024, vaticanstate.va
# - No GDP or Human Development Index is published

TW:
  population: { value: 23299132, year: 2025, source: Ministry of the Interior }
  gdpPerCapita: { value: 39477, year: 2025, currency: USD, source: DGBAS }
  gdp: { value: 922000000000, year: 2025, currency: USD, source: DGBAS }
  hdi: { value: 0.934, year: 2023, source: DGBAS }
VA:
  population: { value: 882, year: 2024, source: Vatican City State }
