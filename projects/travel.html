<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Diary — Florian Preis</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>✈</text></svg>">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ocean:  #a8cce0;
      --unvis:  #e8e2d6;
      --vis:    #3a4a5c;
      --mapbdr: #c8c0b2;
      --bg:     #ffffff;
      --text:   #111111;
      --muted:  #888888;
      --border: #e5e5e5;
      --label:  #bbbbbb;
    }
    html, body { width:100%; height:100%; overflow:hidden;
      font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
      background:var(--bg); color:var(--text); cursor:none; }

    /* ── Cursor ── */
    #cursor { position:fixed; pointer-events:none; z-index:9999;
      width:26px; height:26px; transform:translate(-50%,-50%); }
    #cursor svg { width:100%; height:100%; fill:#111; }

    /* ── Loader ── */
    #loader { position:fixed; inset:0; z-index:8000; background:#000;
      display:flex; align-items:center; justify-content:center; overflow:hidden; }
    #lv { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.9; }
    #loader::after { content:''; position:absolute; inset:0;
      background:rgba(0,0,0,0.38); pointer-events:none; z-index:1; }
    .lc { position:relative; z-index:2; text-align:center;
      display:flex; flex-direction:column; align-items:center; }
    .lt { font-size:clamp(13px,2.2vw,24px); font-weight:300; letter-spacing:0.44em;
      text-transform:uppercase; color:rgba(255,255,255,0.90); margin-bottom:22px;
      width:clamp(160px,26vw,280px); text-align:center; }
    .pt { width:clamp(160px,26vw,280px); height:2px;
      background:rgba(255,255,255,0.14); margin-bottom:10px; overflow:hidden; }
    .pf { height:100%; width:0%; background:rgba(255,255,255,0.75); }
    .pp { font-size:8px; letter-spacing:.28em; color:rgba(255,255,255,0.32);
      text-transform:uppercase; text-align:center; width:clamp(160px,26vw,280px); }
    #loader.fo { animation:fo .6s ease forwards; }
    @keyframes fo { to { opacity:0; pointer-events:none; } }

    /* ── Map ── */
    #map { position:fixed; inset:0; }
    /* Hide all default Google Maps UI chrome */
    .gm-style .gm-style-cc, .gmnoprint, .gm-bundled-control,
    a[href*="maps.google"] { display:none !important; }

    /* ── Tooltip ── */
    #tip { position:fixed; pointer-events:none; z-index:600;
      background:rgba(255,255,255,0.93); color:#111;
      font-size:9px; font-weight:400; letter-spacing:.12em;
      text-transform:uppercase; padding:4px 9px;
      white-space:nowrap; opacity:0; transition:opacity .1s;
      transform:translate(14px,-50%); border:1px solid #e5e5e5; }

    /* ── Title ── */
    #title-wrap { position:fixed; top:26px; left:28px; z-index:600; }
    .ui-title { font-size:10px; font-weight:400; letter-spacing:.30em;
      text-transform:uppercase; color:var(--text); opacity:.45; }

    /* ── Panel ── */
    #panel { position:fixed; bottom:28px; left:28px; z-index:600;
      background:var(--bg); border:1px solid var(--border);
      padding:16px 18px; display:flex; flex-direction:column; gap:13px;
      min-width:168px; }
    .panel-row { display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .panel-label { font-size:10px; font-weight:400; letter-spacing:0.18em;
      text-transform:uppercase; color:var(--muted); }
    .count-val { font-size:13px; font-weight:300; color:var(--text); }
    .legend-row { display:flex; align-items:center; gap:14px; }
    .lrow { display:flex; align-items:center; gap:6px; }
    .lsw { width:11px; height:7px; flex-shrink:0; }
    .lsw.v { background:var(--vis); }
    .lsw.u { background:var(--unvis); border:1px solid var(--mapbdr); }
    .llbl { font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); }
    .panel-divider { height:1px; background:var(--border); }

    /* ── Sidebar ── */
    #sb { position:fixed; top:0; right:0; width:min(380px,100vw); height:100%;
      background:var(--bg); border-left:1px solid var(--border);
      z-index:700; transform:translateX(100%);
      transition:transform .38s cubic-bezier(.4,0,.2,1); overflow-y:auto; }
    #sb.open { transform:translateX(0); }
    .sbh { padding:20px 20px 16px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:10px;
      position:sticky; top:0; background:var(--bg); z-index:1; }
    .sbf { width:30px; height:20px; object-fit:cover; display:block; flex-shrink:0; }
    .sbn { font-size:11px; font-weight:700; letter-spacing:0.18em;
      text-transform:uppercase; color:var(--text); }
    .sbbdg { font-size:7px; letter-spacing:0.18em; text-transform:uppercase;
      color:var(--muted); border:1px solid var(--border); padding:1px 5px; }
    .sbc { margin-left:auto; flex-shrink:0; background:none; border:none;
      cursor:none; color:var(--text); font-size:20px; line-height:1;
      opacity:0.4; transition:opacity 0.15s; padding:2px 4px; }
    .sbc:hover { opacity:1; }
    .sbb { padding:0 20px 36px; }
    .nonote { padding:22px 0; font-size:13px; color:var(--muted); }
    .trip { padding:16px 0; border-bottom:1px solid var(--border); }
    .trip:last-child { border-bottom:none; }
    .trip-meta { display:flex; align-items:center; gap:12px; margin-bottom:9px; flex-wrap:wrap; }
    .trip-date-row { display:flex; align-items:center; gap:5px; }
    .trip-date-row svg { width:10px; height:10px; opacity:0.4; flex-shrink:0; }
    .td { font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--label); }
    .trip-with-row { display:flex; align-items:center; gap:5px; }
    .trip-with-row svg { width:10px; height:10px; opacity:0.4; flex-shrink:0; }
    .twn { font-size:10px; letter-spacing:0.1em; color:var(--muted); }
    .tn { font-size:13px; line-height:1.75; color:var(--text); font-style:normal; font-weight:400; }
    .stats-block { padding:16px 0; border-bottom:1px solid var(--border); }
    .stat-row { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:3px 0; }
    .stat-key { font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--label); flex-shrink:0; }
    .stat-val { font-size:13px; font-weight:300; color:var(--text); text-align:right; }

    @media (max-width:600px) {
      #sb { width:100vw; }
      #panel { bottom:14px; left:14px; }
      #title-wrap { top:14px; left:14px; }
    }
  </style>
</head>

/* ════════════════════════════════════════════════
   STAT FORMATTING
   ════════════════════════════════════════════════ */
function fmtPop(n) {
  if (n >= 1e9) return (n/1e9).toFixed(2).replace(/\.?0+$/,'') + ' B';
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.?0+$/,'') + ' M';
  if (n >= 1e3) return Math.round(n/1e3) + ' K';
  return String(n);
}
function fmtGDP(n) {
  if (n == null) return 'N/A';
  if (n >= 1000) return 'EUR ' + (n/1000).toFixed(2).replace(/\.?0+$/,'') + ' T';
  return 'EUR ' + n.toFixed(1) + ' B';
}
function fmtGDPpc(n) {
  if (n == null) return 'N/A';
  return 'EUR ' + Math.round(n).toLocaleString('en-DE');
}

function renderStats(a2) {
  const s = STATS[a2];
  if (!s) return '';
  const rows = [
    ['Capital',                  s.cap],
    ['Population',               fmtPop(s.pop)],
    ['GDP per Capita (Nominal)', s.gdppc != null
      ? `${fmtGDPpc(s.gdppc)} (${fmtGDP(s.gdp)})` : 'N/A'],
    ['HDI', s.hdi ? `${s.hdi} (${s.hdiR}/193)` : 'N/A'],
  ];
  return `<div class="stats-block">${rows.map(([k,v]) =>
    `<div class="stat-row">
       <span class="stat-key">${k}</span>
       <span class="stat-val">${v}</span>
     </div>`).join('')}</div>`;
}

/* ════════════════════════════════════════════════
   SIDEBAR
   ════════════════════════════════════════════════ */
function openSb(a2, fallbackName) {
  const d = T[a2];
  const displayName = d?.name || fallbackName || a2;
  document.getElementById('sbf').src = `https://flagcdn.com/w40/${a2.toLowerCase()}.png`;
  document.getElementById('sbf').alt = displayName;
  document.getElementById('sbn').textContent = displayName;
  const bdg = document.getElementById('sbbdg');
  if (d?.ter) { bdg.textContent = d.ter; bdg.style.display = ''; }
  else bdg.style.display = 'none';

  const body = document.getElementById('sbb');
  body.innerHTML = renderStats(a2);

  if (!d || !d.trips || !d.trips.length) {
    body.innerHTML += `<p class="nonote">${(!d || !d.v) ? 'Not visited yet.' : 'No trip notes yet.'}</p>`;
  } else {
    const MO = {JANUARY:0,FEBRUARY:1,MARCH:2,APRIL:3,MAY:4,JUNE:5,
                JULY:6,AUGUST:7,SEPTEMBER:8,OCTOBER:9,NOVEMBER:10,DECEMBER:11};
    const pd = s => { const p = s.trim().split(' ');
      return parseInt(p[p.length-1])*100 + (MO[p[0]] ?? 0); };
    const calIcon    = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="14" height="12" rx="1.5"/><path d="M1 7h14"/><path d="M5 1v4M11 1v4"/></svg>`;
    const personIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.314 2.686-6 6-6s6 2.686 6 6"/></svg>`;
    [...d.trips].sort((a,b) => pd(b.date) - pd(a.date)).forEach(tr => {
      const el = document.createElement('div');
      el.className = 'trip';
      el.innerHTML = `
        <div class="trip-meta">
          <div class="trip-date-row">${calIcon}<span class="td">${tr.date}</span></div>
          ${tr.with ? `<div class="trip-with-row">${personIcon}<span class="twn">${tr.with}</span></div>` : ''}
        </div>
        ${tr.note ? `<p class="tn">${tr.note}</p>` : ''}`;
      body.appendChild(el);
    });
  }
  document.getElementById('sb').classList.add('open');
}

const closeSb = () => document.getElementById('sb').classList.remove('open');
document.getElementById('sbc').addEventListener('click', e => { e.stopPropagation(); closeSb(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSb(); });
document.getElementById('sb').addEventListener('click', e => e.stopPropagation());

/* ════════════════════════════════════════════════
   LOADER
   ════════════════════════════════════════════════ */
(function initLoader() {
  const video  = document.getElementById('lv');
  const pfEl   = document.getElementById('pf');
  const ppEl   = document.getElementById('pp');
  const loader = document.getElementById('loader');
  let rafId = null, startTime = null, duration = 0;
  function dismiss() {
    cancelAnimationFrame(rafId);
    pfEl.style.width = '100%'; ppEl.textContent = '100%';
    setTimeout(() => {
      loader.classList.add('fo');
      setTimeout(() => loader.style.display = 'none', 650);
    }, 300);
  }
  function tick() {
    if (!startTime) startTime = performance.now();
    const pct = Math.min((performance.now()-startTime)/1000/duration, 1);
    pfEl.style.width = (pct*100).toFixed(1) + '%';
    ppEl.textContent = Math.floor(pct*100) + '%';
    if (pct < 1) rafId = requestAnimationFrame(tick); else dismiss();
  }
  function start(dur) {
    if (duration) return;
    duration = dur; video.play().catch(() => {});
    rafId = requestAnimationFrame(tick);
  }
  video.addEventListener('loadedmetadata', () => start(video.duration || 4));
  video.addEventListener('ended', dismiss);
  video.addEventListener('error', () => { video.style.display='none'; start(4); });
  setTimeout(() => { if (!duration) { video.style.display='none'; start(4); } }, 2000);
})();

  const dx = e.clientX-clx, dy = e.clientY-cly;
  if (Math.hypot(dx,dy) > 1.5)
    csv.style.transform = `rotate(${Math.atan2(dy,dx)*180/Math.PI+90}deg)`;
  clx = e.clientX; cly = e.clientY;
});

  let didDrag = false;
  map.addListener('mousedown', () => { didDrag = false; });
  map.addListener('drag',      () => { didDrag = true;  });
  /* Click on ocean → close sidebar */
  map.addListener('click', () => { if (!didDrag) closeSb(); });

  /* ── Load topojson and add GeoJSON features ── */
  const [topoRes, topoLib] = await Promise.all([
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r => r.json()),
    new Promise(resolve => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js';
      s.onload = resolve;
      document.head.appendChild(s);
    }),
  ]);

  const geojson = topojson.feature(topoRes, topoRes.objects.countries);

  /* Add each country as a separate GeoJSON feature so we can store
     custom properties (a2 code, name, visited status)               */
  geojson.features.forEach(feat => {
    const numId   = parseInt(feat.id);
    const a2      = N2A[numId] || null;
    const tData   = a2 ? T[a2] : null;
    const visited = !!tData?.v;
    const name    = tData?.name
      || (a2 ? (STATS[a2] ? null : null) : null)   /* fallback handled below */

    map.data.addGeoJson({
      type: 'Feature',
      id:   feat.id,
      geometry:   feat.geometry,
      properties: { a2, visited, name: name || '' },
    });
  });

  /* Style all features */
  const VIS_FILL   = '#3a4a5c';

  const UNV_STROKE = '#c8c0b2';

  map.data.setStyle(feat => {
    const v = feat.getProperty('visited');
    return {
      fillColor:   v ? VIS_FILL   : UNV_FILL,
      fillOpacity: 0.92,
      strokeColor: v ? VIS_STROKE : UNV_STROKE,
      strokeWeight: 0.6,
      clickable: true,
    };
  });

  /* ── Hover ── */
  let hoveredFeat = null;

    if (hoveredFeat) map.data.revertStyle(hoveredFeat);
    hoveredFeat = e.feature;
    map.data.overrideStyle(e.feature, { fillOpacity: 0.65 });
    /* Tooltip: prefer T name, then reverse-lookup numeric ID → ALL_NAMES */

    const numId = parseInt(e.feature.getId());
    const ALL_NAMES = {

      203:"Czechia",208:"Denmark",214:"Dominican Republic",218:"Ecuador",222:"El Salvador",
      231:"Ethiopia",233:"Estonia",246:"Finland",250:"France",266:"Gabon",276:"Germany",
      288:"Ghana",300:"Greece",320:"Guatemala",324:"Guinea",328:"Guyana",332:"Haiti",
      340:"Honduras",348:"Hungary",352:"Iceland",356:"India",360:"Indonesia",364:"Iran",
      368:"Iraq",372:"Ireland",376:"Israel",380:"Italy",384:"Ivory Coast",388:"Jamaica",
      392:"Japan",398:"Kazakhstan",400:"Jordan",404:"Kenya",408:"North Korea",410:"South Korea",

      430:"Liberia",434:"Libya",440:"Lithuania",442:"Luxembourg",454:"Malawi",458:"Malaysia",
      466:"Mali",480:"Mauritius",484:"Mexico",496:"Mongolia",499:"Montenegro",504:"Morocco",
      508:"Mozambique",512:"Oman",516:"Namibia",524:"Nepal",528:"Netherlands",540:"New Caledonia",
      548:"Vanuatu",554:"New Zealand",558:"Nicaragua",562:"Niger",566:"Nigeria",578:"Norway",
      586:"Pakistan",591:"Panama",598:"Papua New Guinea",600:"Paraguay",604:"Peru",608:"Philippines",

    };

    if (tipName) showTip(tipName);
  });
  map.data.addListener('mouseout', e => {
    hideTip();
    if (hoveredFeat) { map.data.revertStyle(hoveredFeat); hoveredFeat = null; }
  });

  /* ── Click ── */
  map.data.addListener('click', e => {
    if (didDrag) return;
    const a2 = e.feature.getProperty('a2');
    if (a2) {
      openSb(a2);
    } else {
      /* Country not in N2A — show minimal sidebar with name only */
      const numId = parseInt(e.feature.getId());
      const name  = e.feature.getProperty('name') || String(numId);
      document.getElementById('sbf').src = '';
