:root {

.ptr { position: fixed; z-index: 60; left: 50%; top: 0; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; background: #fff; color: var(--muted);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.14); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transform: translateY(-48px); }
