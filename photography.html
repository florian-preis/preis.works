<!-- ══ LIGHTBOX ══ -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <div class="lightbox-stage" id="lightboxStage">
    <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
    <button class="lightbox-btn lightbox-prev" onclick="lightboxNav(-1)" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="">
    <button class="lightbox-btn lightbox-next" onclick="lightboxNav(1)" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </div>
  <div class="lightbox-footer">
    <div class="lightbox-meta" id="lightboxMeta">
      <div class="lightbox-location">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="margin-top:1px"><circle cx="12" cy="7" r="4"/><line x1="12" y1="11" x2="12" y2="21"/></svg>
        <span class="lightbox-caption" id="lightboxCaption"></span>
      </div>
      <div class="lightbox-date-row">
        <span class="lightbox-date" id="lightboxDate"></span>
        <span class="lightbox-counter" id="lightboxCounter"></span>
      </div>
    </div>
  </div>
</div>
